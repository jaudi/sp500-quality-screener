name: Weekly Nasdaq-100 Growth Screener

on:
  schedule:
    - cron: "0 6 * * 3" # Every Wednesday 06:00 UTC (S&P Monday, IBEX Tuesday)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Nasdaq-100 growth screener
        run: python screener_nasdaq100.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest-report-nasdaq100.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly Nasdaq-100 growth screener report"
            git pull --rebase origin main
            git push
          fi
