name: Weekly IBEX 35 Quality Screener

on:
  schedule:
    - cron: "0 6 * * 2" # Every Tuesday 06:00 UTC (day after the S&P 500 run)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IBEX 35 screener
        run: python screener_ibex35.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest-report-ibex35.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly IBEX 35 screener report"
            git pull --rebase origin main
            git push
          fi
