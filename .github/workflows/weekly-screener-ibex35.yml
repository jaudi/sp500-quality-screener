name: Weekly IBEX 35 Quality Screener

on:
  schedule:
    # Semanal: datos, ranking y universo. Sin Claude, coste cero.
    - cron: "0 6 * * 2"
    # Mensual: lo mismo más el informe escrito. Es la unica ejecucion
    # que gasta tokens, y la unica que necesita la clave.
    - cron: "0 7 2 * *"
  workflow_dispatch:
    inputs:
      con_informe:
        description: "Generar tambien el informe escrito (gasta tokens)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IBEX 35 screener
        run: python screener_ibex35.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GENERAR_INFORME: ${{ (github.event.schedule == '0 7 2 * *' || github.event.inputs.con_informe == 'true') && '1' || '' }}

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # El runner multifactor escribe dos ficheros: el informe que lee la
          # pagina del screener, y el universo entero que alimenta el screener
          # interactivo. Anadir solo el primero genera el segundo y lo tira.
          git add data/latest-report-ibex35.json data/universe-ibex35.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly IBEX 35 screener report"
            git pull --rebase origin main
            git push
          fi
